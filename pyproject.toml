[project]
name = "it-support-agent"
version = "1.0.0"
description = "Conversational IT support agent with tool-calling RAG, private knowledge retrieval, web fallback, and Redis memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "pydantic-settings==2.10.1",
    "langgraph==1.1.10",
    "langchain-core==1.6.11",
    "langchain-community==0.4.2",
    "langchain-groq==1.1.3",
    "langchain-huggingface==1.2.3",
    "langchain-tavily==0.2.18",
    "langchain-pinecone==0.2.13",
    "langchain-text-splitters==1.1.2",
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
    "pinecone==7.3.0",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "python-dotenv==1.1.1",
    "redis==6.4.0",
    "rank-bm25==0.2.2",
    "langchain-google-genai==4.4.0",
    "langchain-openai==1.6.7",
    "langsmith>=0.14.14",
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
